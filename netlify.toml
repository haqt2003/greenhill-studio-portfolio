[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.19.0"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

[[redirects]]
  from = "/legal/site-privacy/"
  to = "/legal/privacy/"
  status = 301
  force = true

[[redirects]]
  from = "/legal/site-terms/"
  to = "/legal/terms/"
  status = 301
  force = true
